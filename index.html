<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
  <link rel="manifest" href="assets/favicon/site.webmanifest" />
  <title>Login | TapIn</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <main class="login-page">
    <div class="login-card">
      <h1 class="login-title">Login</h1>
      <p class="login-subtitle">Enter your email below to login to your account</p>
      <form class="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" />

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" type="password" name="password" autocomplete="current-password" />
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-label="Toggle password visibility" role="button"
            tabindex="0">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>

        <button type="submit" class="login-button">Login</button>
      </form>
      <p class="login-helper">
        Use your assigned company email and password. If you don't have credentials, contact your administrator.
      </p>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>

</html>
