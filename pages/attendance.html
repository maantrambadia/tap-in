<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />
  <title>Employee Attendance | TapIn</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/attendance.css" />
</head>

<body>
  <div class="attendance">
    <div class="container">
      <header class="top-nav">
        <a href="dashboard.html" class="logo">TapIn</a>
        <nav class="nav-links">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="attendance.html" class="nav-link active">Attendance</a>
          <a href="leave.html" class="nav-link">Leave</a>
          <a href="payroll.html" class="nav-link">Payroll</a>
          <a href="holidays.html" class="nav-link">Holidays</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>
        <div class="user-menu">
          <span class="user-name">Alex Mercer</span>
          <a href="../index.html" class="user-avatar">A</a>
        </div>
      </header>

      <section class="greeting">
        <h1 class="greeting-title">Good Afternoon!</h1>
        <p class="greeting-subtitle">Welcome back, User</p>
      </section>

      <section class="attendance-card">
        <div class="attendance-info">
          <h2 class="card-title">Today's Attendance</h2>
          <p class="card-subtitle">Mark your attendance and track your working hours</p>
          <div class="time-block">
            <p class="time-label">Current Time</p>
            <p class="time-value">
              <span class="time-main">01:20:56</span>
              <span class="time-ampm">PM</span>
            </p>
            <p class="time-date">Sunday, August 2, 2026</p>
          </div>
          <p class="attendance-status">Status: Not Checked In</p>
        </div>
        <div class="attendance-action">
          <button type="button" class="checkin-button">Check In Now</button>
        </div>
      </section>
    </div>
  </div>
</body>

</html>
